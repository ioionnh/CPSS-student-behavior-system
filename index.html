<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พี่หลอนยา</title>
    <style>
        body {
            background: #1a1a1a; /* สีพื้นดำ */
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            text-align: center;
            padding: 10px;
        }
        h1 {
            color: #ffffff;
            text-shadow: 0 0 15px #1e3a8a, 0 0 30px #d4af37; /* น้ำเงิน-ทอง */
            font-size: 1.8em;
            animation: glow 2s infinite alternate;
            margin: 10px 0;
        }
        .intro-container, .quiz-container, .result-container {
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.8), rgba(212, 175, 55, 0.8)); /* น้ำเงิน-ทองโปร่งแสง */
            padding: 15px;
            border: 2px solid #d4af37;
            border-radius: 10px;
            box-shadow: 0 0 20px #1e3a8a;
            margin-bottom: 15px;
            animation: slideIn 0.5s;
        }
        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 10px 0;
        }
        .choice {
            padding: 12px;
            font-size: 1em;
            background: linear-gradient(45deg, #1e3a8a, #2a4365); /* น้ำเงินเข้ม */
            color: #ffffff;
            border: 2px solid #d4af37;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            animation: pulse 2s infinite;
            touch-action: manipulation;
        }
        .choice:hover {
            background: linear-gradient(45deg, #d4af37, #f3f4f6); /* ทอง-เทาอ่อน */
            color: #1e3a8a;
            box-shadow: 0 0 15px #d4af37;
            transform: translateY(-3px);
        }
        .choice.selected {
            background: linear-gradient(45deg, #d4af37, #f3f4f6);
            color: #1e3a8a;
            border-color: #1e3a8a;
            animation: none;
        }
        input {
            padding: 12px;
            margin: 10px 0;
            font-size: 1em;
            background-color: #1e3a8a;
            color: #ffffff;
            border: 2px solid #d4af37;
            border-radius: 8px;
            width: 90%;
            max-width: 200px;
            transition: border 0.3s;
            animation: shake 3s infinite;
        }
        input:focus {
            border-color: #f3f4f6;
            box-shadow: 0 0 10px #d4af37;
            outline: none;
            animation: none;
        }
        button {
            padding: 12px 24px;
            font-size: 1em;
            background: linear-gradient(45deg, #1e3a8a, #2a4365); /* น้ำเงินเข้ม */
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px #d4af37;
            transition: transform 0.3s, box-shadow 0.3s;
            animation: pulse 2s infinite;
            touch-action: manipulation;
        }
        button:hover {
            background: linear-gradient(45deg, #d4af37, #f3f4f6);
            color: #1e3a8a;
            transform: scale(1.05);
            box-shadow: 0 0 20px #1e3a8a;
            animation: none;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            animation: none;
        }
        #result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 1em;
            animation: fadeIn 0.5s;
        }
        #result.correct {
            background: linear-gradient(45deg, #d4af37, #1e3a8a);
            color: #ffffff;
        }
        #result.wrong {
            background: linear-gradient(45deg, #7f1d1d, #1e3a8a); /* แดงเข้ม */
            color: #ffffff;
        }
        #lockMessage {
            color: #d4af37;
            font-size: 1em;
            margin: 20px 0;
            animation: flash 1s infinite;
        }
        #resetContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }
        #resetInput {
            padding: 10px;
            font-size: 1em;
            background-color: #1e3a8a;
            color: #ffffff;
            border: 2px solid #d4af37;
            border-radius: 8px;
            width: 90%;
            max-width: 150px;
            animation: shake 3s infinite;
        }
        #resetInput:focus {
            border-color: #f3f4f6;
            box-shadow: 0 0 10px #d4af37;
            outline: none;
            animation: none;
        }
        #resetButton {
            padding: 10px 20px;
            font-size: 1em;
            width: 90%;
            max-width: 150px;
        }
        #resetResult {
            color: #7f1d1d;
            font-size: 0.9em;
            margin-top: 10px;
            animation: flash 1s infinite;
        }
        #score {
            font-size: 1.2em;
            animation: slideFromLeft 1s;
        }
        #finalResult {
            font-size: 1em;
            animation: slideFromLeft 1s;
        }
        a {
            color: #d4af37;
            text-decoration: none;
            transition: color 0.3s;
            animation: glowText 2s infinite alternate;
        }
        a:hover {
            color: #f3f4f6;
            text-shadow: 0 0 10px #d4af37;
        }
        .hidden {
            display: none;
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px #1e3a8a, 0 0 20px #d4af37; }
            to { text-shadow: 0 0 20px #1e3a8a, 0 0 30px #d4af37; }
        }
        @keyframes slideIn {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-3px); }
            20%, 40%, 60%, 80% { transform: translateX(3px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideFromLeft {
            from { transform: translateX(-50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes glowText {
            from { text-shadow: 0 0 5px #d4af37; }
            to { text-shadow: 0 0 10px #1e3a8a; }
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.5em; }
            .intro-container, .quiz-container, .result-container { padding: 10px; }
            .choice, input, button { font-size: 0.9em; }
            input, #resetInput { width: 85%; }
            #resetButton { width: 85%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>พี่หลอนยา</h1>
        <div id="introContainer" class="intro-container">
            <p>ถ้าตอบถูกจะได้คำใบ้ข้อละ 1 คำใบ้ แต่ๆๆ ถ้าตอบผิดเกิน3คำถามก็รอไปน่ะจ้ะะ</p>
            <button onclick="startQuiz()" aria-label="เริ่มตอบคำถาม">เริ่มตอบ</button>
        </div>
        <div id="quizContainer" class="quiz-container hidden">
            <p id="question"></p>
            <div id="choices" class="choices"></div>
            <input type="text" id="answerInput" placeholder="ใส่เลขลับ 4 หลัก" class="hidden" aria-label="กรอกเลขลับ">
            <button onclick="checkAnswer()" id="submitButton" class="hidden" aria-label="ยืนยันคำตอบ">ยืนยันคำตอบ</button>
            <button onclick="nextQuestion()" id="nextButton" class="hidden" aria-label="ไปข้อถัดไป">ข้อถัดไป</button>
        </div>
        <div id="result"></div>
        <div id="lockMessage"></div>
        <div id="resetContainer" class="hidden">
            <input type="text" id="resetInput" placeholder="ใส่รหัส 4 หลัก" aria-label="กรอกรหัสเพื่อรีเซ็ต">
            <button onclick="resetCooldown()" id="resetButton" aria-label="รีเซ็ตคูลดาวน์">รีเซ็ตคูลดาวน์</button>
            <div id="resetResult"></div>
        </div>
        <div id="resultContainer" class="result-container hidden">
            <p id="score"></p>
            <p id="finalResult">LAW | RU ⚖️ อะไรน้าาา 🤫 และ <a href="https://www.instagram.com/21_txwxttxw" target="_blank">@21_txwxttxw</a></p>
            <button onclick="restartQuiz()" aria-label="เล่นควิซใหม่">เล่นควิซใหม่</button>
        </div>
    </div>

    <script>
        const questions = [
            { 
                id: 1, 
                text: 'พี่หล่อไหมอ่ะ', 
                answer: 'หล่อมากกกก', 
                choices: [
                    'ถึงจะไม่หล่อแต่ก็ไม่หล่ออยู่ดี', 
                    'เหมือนลิง', 
                    'หล่อมากกกก', 
                    'หน้าตาอย่างนี้ก็กล้าถามเนาะ'
                ], 
                hint: 'พี่ชอบกฎหมาย' 
            },
            { 
                id: 2, 
                text: 'อะไรอยู่ข้างหน้าเลขหรือพยัญชนะ?', 
                answer: null, 
                choices: [], 
                hint: 'ข้อนี้คือคำใบ้เลย ไปข้อต่อไป' 
            },
            { 
                id: 3, 
                text: 'A1 = 7,24,41,58,75,.....????', 
                answer: '92', 
                choices: ['71', '92', '58'], 
                hint: 'สมการนี้คืออะไรน้าาอย่าไปคิดมาก' 
            },
            { 
                id: 4, 
                text: 'ไม่มีอะไรจะบอกแล้วววว', 
                answer: null, 
                choices: [], 
                hint: 'ขอให้โชคดีนะ ขอให้เจอพี่รหัสกับลุง หรือป้านะ?' 
            },
            { 
                id: 5, 
                text: 'เจอพี่รหัสหรือยังน้าาา เขาอาจจะล็อกไว้ก็ได้นะ', 
                answer: '0609', 
                hint: '' 
            }
        ];

        let selectedQuestions = questions;
        let currentQuestion = 0;
        let score = { correct: 0, wrong: 0 };
        let answers = [];
        let wrongCount = 0;
        let isLocked = false;
        let lockUntil = localStorage.getItem('lockUntil') || 0;

        // เริ่มควิซ
        function startQuiz() {
            document.getElementById('introContainer').classList.add('hidden');
            document.getElementById('quizContainer').classList.remove('hidden');
            document.getElementById('resetContainer').classList.add('hidden');
            showQuestion();
        }

        // สุ่มตัวเลือก
        function shuffleChoices(choices) {
            return [...choices].sort(() => Math.random() - 0.5);
        }

        // แสดงคำถามและตัวเลือก/ช่องกรอก
        function showQuestion() {
            if (isLocked) {
                updateLockMessage();
                return;
            }
            if (currentQuestion < selectedQuestions.length) {
                const q = selectedQuestions[currentQuestion];
                document.getElementById('question').innerText = `ข้อ ${currentQuestion + 1}: ${q.text}`;
                const choicesDiv = document.getElementById('choices');
                const answerInput = document.getElementById('answerInput');
                const submitButton = document.getElementById('submitButton');
                const nextButton = document.getElementById('nextButton');
                choicesDiv.innerHTML = '';
                answerInput.value = '';
                document.getElementById('result').innerText = '';

                if (q.id === 5) { // ข้อ 5 ใช้ช่องกรอก
                    choicesDiv.classList.add('hidden');
                    answerInput.classList.remove('hidden');
                    submitButton.classList.remove('hidden');
                    nextButton.classList.add('hidden');
                    submitButton.disabled = false;
                } else if (q.choices.length > 0) { // ข้อ 1, 3 ใช้ตัวเลือก
                    choicesDiv.classList.remove('hidden');
                    answerInput.classList.add('hidden');
                    submitButton.classList.remove('hidden');
                    nextButton.classList.add('hidden');
                    const shuffledChoices = shuffleChoices(q.choices);
                    shuffledChoices.forEach(choice => {
                        const choiceBtn = document.createElement('div');
                        choiceBtn.className = 'choice';
                        choiceBtn.innerText = choice;
                        choiceBtn.onclick = () => selectChoice(choiceBtn, choice);
                        choicesDiv.appendChild(choiceBtn);
                    });
                    submitButton.disabled = true;
                } else { // ข้อ 2, 4 ไม่มีตัวเลือก
                    choicesDiv.classList.add('hidden');
                    answerInput.classList.add('hidden');
                    submitButton.classList.add('hidden');
                    nextButton.classList.remove('hidden');
                    typeWriter(`คำใบ้: ${q.hint}\nอ่านคำใบ้นี้แล้วยังซื่อบื้ออยู่อีกกดถัดไปสิ!`, 'result');
                }

                document.getElementById('quizContainer').classList.remove('hidden');
                document.getElementById('resultContainer').classList.add('hidden');
            } else {
                document.getElementById('quizContainer').classList.add('hidden');
                document.getElementById('resultContainer').classList.remove('hidden');
                document.getElementById('score').innerText = `ตอบถูก: ${score.correct} ข้อ, ตอบผิด: ${score.wrong} ข้อ`;
                document.getElementById('lockMessage').innerText = '';
                document.getElementById('resetContainer').classList.add('hidden');
            }
        }

        // เลือกตัวเลือก
        let selectedChoice = null;
        function selectChoice(btn, choice) {
            document.querySelectorAll('.choice').forEach(c => c.classList.remove('selected'));
            btn.classList.add('selected');
            selectedChoice = choice;
            document.getElementById('submitButton').disabled = false;
        }

        // ตรวจคำตอบ
        function checkAnswer() {
            if (isLocked) return;
            const q = selectedQuestions[currentQuestion];
            let userAnswer;

            if (q.id === 5) { // ข้อ 5 ใช้ช่องกรอก
                userAnswer = document.getElementById('answerInput').value.trim();
            } else { // ข้อ 1, 3 ใช้ตัวเลือก
                if (!selectedChoice) return;
                userAnswer = selectedChoice;
            }

            const correctAnswer = q.answer ? q.answer.toString() : null;
            const isCorrect = userAnswer === correctAnswer;
            answers.push({
                question: q.text,
                userAnswer,
                isCorrect
            });

            const submitButton = document.getElementById('submitButton');
            const nextButton = document.getElementById('nextButton');

            if (isCorrect) {
                score.correct++;
                typeWriter(`ถูกไปก็ไม่ได้ใจเขาหรอก! คำใบ้: ${q.hint}`, 'result');
                document.getElementById('result').className = 'correct';
                submitButton.classList.add('hidden');
                nextButton.classList.remove('hidden');
            } else {
                score.wrong++;
                wrongCount++;
                document.getElementById('result').innerText = 'ว้ายยยผิด!';
                document.getElementById('result').className = 'wrong';
                submitButton.classList.remove('hidden');
                nextButton.classList.add('hidden');
            }

            if (wrongCount > 3) {
                isLocked = true;
                lockUntil = Date.now() + 20 * 60 * 1000; // ล็อก 20 นาที
                localStorage.setItem('lockUntil', lockUntil);
                updateLockMessage();
                return;
            }
        }

        // ไปข้อถัดไป
        function nextQuestion() {
            currentQuestion++;
            selectedChoice = null;
            showQuestion();
        }

        // อัพเดตข้อความล็อก
        function updateLockMessage() {
            const now = Date.now();
            if (now < lockUntil) {
                const remaining = Math.ceil((lockUntil - now) / 1000 / 60);
                document.getElementById('quizContainer').classList.add('hidden');
                document.getElementById('resultContainer').classList.add('hidden');
                document.getElementById('introContainer').classList.add('hidden');
                document.getElementById('lockMessage').innerText = `ล็อกควิซ! รอ ${remaining} นาที หรือกรอกรหัสเพื่อรีเซ็ต`;
                document.getElementById('resetContainer').classList.remove('hidden');
                document.getElementById('resetResult').innerText = '';
            } else {
                isLocked = false;
                localStorage.removeItem('lockUntil');
                document.getElementById('introContainer').classList.remove('hidden');
                document.getElementById('lockMessage').innerText = '';
                document.getElementById('resetContainer').classList.add('hidden');
            }
        }

        // รีเซ็ตคูลดาวน์
        function resetCooldown() {
            const resetInput = document.getElementById('resetInput').value.trim();
            const resetResult = document.getElementById('resetResult');
            if (resetInput === '0609') {
                isLocked = false;
                lockUntil = 0;
                wrongCount = 0;
                localStorage.removeItem('lockUntil');
                currentQuestion = 0;
                score.correct = 0;
                score.wrong = 0;
                answers = [];
                document.getElementById('introContainer').classList.remove('hidden');
                document.getElementById('quizContainer').classList.add('hidden');
                document.getElementById('resultContainer').classList.add('hidden');
                document.getElementById('lockMessage').innerText = '';
                document.getElementById('resetContainer').classList.add('hidden');
                document.getElementById('resetInput').value = '';
                resetResult.innerText = '';
            } else {
                resetResult.innerText = 'รหัสผิด!';
            }
        }

        // รีสตาร์ทควิซ
        function restartQuiz() {
            currentQuestion = 0;
            score.correct = 0;
            score.wrong = 0;
            wrongCount = 0;
            answers = [];
            document.getElementById('introContainer').classList.remove('hidden');
            document.getElementById('quizContainer').classList.add('hidden');
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('resetContainer').classList.add('hidden');
        }

        // Typewriter Effect
        function typeWriter(text, elementId, speed = 50) {
            let i = 0;
            document.getElementById(elementId).innerText = '';
            function type() {
                if (i < text.length) {
                    document.getElementById(elementId).innerText += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        // เริ่มต้น
        if (Date.now() < lockUntil) {
            isLocked = true;
            updateLockMessage();
        }
    </script>
</body>
</html>
